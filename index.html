<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daftar Hadir Jamaah AL-HIKMAH</title>

<style>

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f2f5f9;
  color:#333;
}

.header{
  background:#087f5b;
  color:white;
  padding:20px;
  text-align:center;
}

.header h2{
  margin:0;
}

.container{
  padding:15px;
}


.card{
  background:white;
  border-radius:15px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 3px 8px rgba(0,0,0,.1);
}


.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px;
}


.menu{
 background:white;
 padding:20px;
 border-radius:15px;
 text-align:center;
 cursor:pointer;
 box-shadow:0 3px 8px rgba(0,0,0,.1);
}


.menu:hover{
 background:#e8fff7;
}


.angka{
 font-size:35px;
 font-weight:bold;
 color:#087f5b;
}


button{
 background:#087f5b;
 color:white;
 border:none;
 padding:12px 20px;
 border-radius:10px;
 width:100%;
 font-size:16px;
}


.loading{
 text-align:center;
 padding:20px;
}


</style>

</head>


<body>


<div class="header">

<h2>
DAFTAR HADIR JAMAAH<br>
PENGAJIAN AL-HIKMAH
</h2>

</div>



<div class="container">


<div class="card">

<h3>Dashboard</h3>

<div id="status" class="loading">
Mengambil data...
</div>


</div>



<div class="grid">


<div class="menu">

<div class="angka" id="jumlahJamaah">
0
</div>

<p>
👥 Jamaah
</p>

</div>



<div class="menu">

<div class="angka" id="jumlahHadir">
0
</div>

<p>
✅ Kehadiran
</p>

</div>


</div>



<br>


<div class="card">

<button onclick="tes()">
Muat Ulang Data
</button>

</div>



</div>



<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbzrdmWWyFdavRs5ZZa83gPWTSH0TXYu5wN98dLXIamohtfwceAmrUj69XDQGpz-Ta9t/exec";



function tes(){


fetch(API_URL+"?action=init")

.then(r=>r.json())

.then(data=>{


console.log(data);



if(data.ok){


document.getElementById(
"jumlahJamaah"
).innerHTML=data.jumlahJamaah;



document.getElementById(
"jumlahHadir"
).innerHTML=data.jumlahHadir;



document.getElementById(
"status"
).innerHTML=
"Database terhubung ✅";


}


else{


document.getElementById(
"status"
).innerHTML=data.pesan;


}



})


.catch(err=>{


document.getElementById(
"status"
).innerHTML=
"Koneksi gagal";


console.log(err);


});


}



tes();


</script>


</body>
</html>
