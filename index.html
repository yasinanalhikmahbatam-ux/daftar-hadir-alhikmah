<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daftar Hadir Jamaah AL-HIKMAH</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f5f9;
}

.header{
background:#087f5b;
color:white;
padding:20px;
text-align:center;
}

.container{
padding:15px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.card,.menu{
background:white;
padding:20px;
border-radius:15px;
margin-top:15px;
box-shadow:0 3px 8px #ddd;
}

.menu{
text-align:center;
cursor:pointer;
}

.angka{
font-size:35px;
font-weight:bold;
color:#087f5b;
}

input,textarea{

width:100%;
padding:12px;
box-sizing:border-box;
margin-top:8px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;

}


button{

width:100%;
padding:12px;
background:#087f5b;
color:white;
border:0;
border-radius:10px;
font-size:16px;

}


.jamaah-card{

background:white;
padding:15px;
border-radius:12px;
margin-bottom:10px;
box-shadow:0 2px 5px #ddd;

}


.nama{

font-size:18px;
font-weight:bold;
color:#087f5b;

}


.no{

color:#777;
font-size:13px;

}


.hidden{

display:none;

}

</style>

</head>


<body>


<div class="header">

<h2>
DAFTAR HADIR JAMAAH<br>
PENGAJIAN AL-HIKMAH
</h2>

</div>



<div class="container">



<div class="grid">


<div class="menu">

<div class="angka" id="jumlahJamaah">
0
</div>

👥 Jamaah

</div>



<div class="menu" onclick="bukaAbsensi()">

<div class="angka">
✅
</div>

Absensi

</div>


</div>





<div class="card">


<h3>
Tambah Jamaah
</h3>


<input id="nama"
placeholder="Nama Jamaah">


<textarea id="alamat"
placeholder="Alamat"></textarea>


<button onclick="simpanJamaah()">
Simpan Jamaah
</button>


</div>





<div class="card">

<h3>
Daftar Jamaah
</h3>

<div id="daftarJamaah">
Memuat...
</div>


</div>






<div class="card hidden" id="halamanAbsensi">


<h3>
Absensi Mingguan
</h3>


<input type="date" id="tanggalAbsensi">


<div id="daftarAbsensi"></div>


<br>


<button onclick="simpanAbsensi()">
Simpan Kehadiran
</button>


</div>



</div>





<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbzrdmWWyFdavRs5ZZa83gPWTSH0TXYu5wN98dLXIamohtfwceAmrUj69XDQGpz-Ta9t/exec";



let dataJamaah=[];




// =====================
// AMBIL DATA JAMAAH
// =====================

function loadData(){


fetch(API_URL+"?action=jamaah")

.then(r=>r.json())

.then(res=>{


dataJamaah=res.data || [];


jumlahJamaah.innerHTML=
dataJamaah.length;



let html="";


dataJamaah.forEach(function(j,i){


html+=`

<div class="jamaah-card">

<div class="no">
No. ${i+1}
</div>


<div class="nama">
${j.nama}
</div>


<div>
${j.alamat || "-"}
</div>


</div>

`;


});


daftarJamaah.innerHTML=
html || "Belum ada jamaah";


});


}



loadData();






// =====================
// SIMPAN JAMAAH
// =====================

function simpanJamaah(){


let data={


action:"simpanJamaah",

nama:
nama.value,


alamat:
alamat.value


};



kirim(data);


nama.value="";
alamat.value="";


}





// =====================
// BUKA ABSENSI
// =====================

function bukaAbsensi(){


halamanAbsensi.classList.remove("hidden");


buatAbsensi();


}





function buatAbsensi(){


let html="";


dataJamaah.forEach(function(j){


html+=`

<div class="jamaah-card">


<div class="nama">
${j.nama}
</div>


<div>
<input type="checkbox"
id="hadir_${j.id}"
checked>

✅ Hadir

</div>


</div>


`;


});


daftarAbsensi.innerHTML=html;


}






// =====================
// SIMPAN ABSENSI
// =====================


function simpanAbsensi(){


let tanggal=
tanggalAbsensi.value;



if(!tanggal){

alert("Pilih tanggal dulu");
return;

}



let daftar=[];



dataJamaah.forEach(function(j){


let cek=
document.getElementById(
"hadir_"+j.id
);



if(cek.checked){


daftar.push({

idJamaah:j.id,

nama:j.nama,

status:"Hadir"

});


}


});




let payload={


action:"saveAttendance",

tanggal:tanggal,

data:daftar


};



kirim(payload);


}






// =====================
// KIRIM KE APPS SCRIPT
// =====================


function kirim(data){



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded"

},

body:

"payload="+
encodeURIComponent(
JSON.stringify(data)
)


})


.then(r=>r.json())


.then(res=>{


alert(
res.pesan ||
res.message
);


loadData();


})


.catch(err=>{


alert(
"Gagal: "+err
);


});


}



</script>


</body>
</html>
