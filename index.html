<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daftar Hadir Jamaah AL-HIKMAH</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f5f9;
}

.header{
background:#087f5b;
color:white;
padding:20px;
text-align:center;
}

.container{
padding:15px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 3px 8px #ddd;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.menu{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
cursor:pointer;
}

.angka{
font-size:35px;
font-weight:bold;
color:#087f5b;
}

input,textarea{

width:100%;
padding:12px;
margin-top:8px;
margin-bottom:10px;
box-sizing:border-box;
border-radius:8px;
border:1px solid #ccc;

}


button{

background:#087f5b;
color:white;
border:none;
padding:12px;
width:100%;
border-radius:10px;

}


table{

width:100%;
border-collapse:collapse;

}


td,th{

padding:8px;
border-bottom:1px solid #ddd;

}

</style>

</head>


<body>


<div class="header">

<h2>
DAFTAR HADIR JAMAAH<br>
PENGAJIAN AL-HIKMAH
</h2>

</div>


<div class="container">


<div class="grid">

<div class="menu">

<div class="angka" id="jumlahJamaah">0</div>

👥 Jamaah

</div>


<div class="menu">

<div class="angka" id="jumlahHadir">0</div>

✅ Kehadiran

</div>


</div>



<div class="card">

<h3>Tambah Jamaah</h3>


<input id="nama" placeholder="Nama Jamaah">


<textarea id="alamat" placeholder="Alamat"></textarea>


<button onclick="simpanJamaah()">
Simpan Jamaah
</button>


</div>




<div class="card">


<h3>Daftar Jamaah</h3>


<table>

<thead>

<tr>
<th>No</th>
<th>Nama</th>
<th>Alamat</th>
</tr>

</thead>


<tbody id="tabelJamaah">

</tbody>


</table>


</div>



</div>




<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbzrdmWWyFdavRs5ZZa83gPWTSH0TXYu5wN98dLXIamohtfwceAmrUj69XDQGpz-Ta9t/exec";




function loadData(){


fetch(API_URL+"?action=jamaah")

.then(r=>r.json())

.then(res=>{


let html="";


res.data.forEach((j,i)=>{


html += `

<tr>

<td>${i+1}</td>

<td>${j.nama}</td>

<td>${j.alamat}</td>

</tr>

`;

});


document.getElementById(
"tabelJamaah"
).innerHTML=html;



document.getElementById(
"jumlahJamaah"
).innerHTML=res.data.length;


});


}





function simpanJamaah(){


let data={

action:"simpanJamaah",

nama:
document.getElementById("nama").value,

alamat:
document.getElementById("alamat").value

};



fetch(API_URL,{

method:"POST",

body:JSON.stringify(data)

})


.then(r=>r.json())

.then(res=>{


alert(res.pesan);


document.getElementById("nama").value="";

document.getElementById("alamat").value="";


loadData();


});


}




loadData();


</script>


</body>
</html>
