<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daftar Hadir Jamaah AL-HIKMAH</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f5f9;
}

.header{
background:#087f5b;
color:white;
padding:20px;
text-align:center;
}

.container{
padding:15px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 3px 8px #ddd;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.menu{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
}

.angka{
font-size:35px;
font-weight:bold;
color:#087f5b;
}

input,textarea{

width:100%;
padding:12px;
margin-top:8px;
margin-bottom:10px;
box-sizing:border-box;
border-radius:8px;
border:1px solid #ccc;

}


button{

background:#087f5b;
color:white;
border:none;
padding:12px;
width:100%;
border-radius:10px;
cursor:pointer;

}


.jamaah-card{

background:white;
padding:15px;
border-radius:14px;
margin-bottom:10px;
box-shadow:0 2px 6px #ddd;

}


.nama{

font-size:18px;
font-weight:bold;
color:#087f5b;

}


.no{

font-size:13px;
color:#777;

}

</style>

</head>


<body>


<div class="header">

<h2>
DAFTAR HADIR JAMAAH<br>
PENGAJIAN AL-HIKMAH
</h2>

</div>



<div class="container">


<div class="grid">


<div class="menu">

<div class="angka" id="jumlahJamaah">
0
</div>

👥 Jamaah

</div>



<div class="menu" onclick="bukaAbsensi()">

<div class="angka">
✅
</div>

Absensi

</div>


</div>




<div class="card">


<h3>
Tambah Jamaah
</h3>


<input id="nama"
placeholder="Nama Jamaah">


<textarea id="alamat"
placeholder="Alamat"></textarea>


<button onclick="simpanJamaah()">
Simpan Jamaah
</button>


</div>




<div class="card">

<h3>
Daftar Jamaah
</h3>

<div id="daftarJamaah"></div>

</div>



<div class="card"
id="halamanAbsensi"
style="display:none;">


<h3>
Absensi Mingguan
</h3>


<input type="date"
id="tanggalAbsensi">



<div id="daftarAbsensi"></div>


<br>


<button onclick="simpanAbsensi()">
Simpan Kehadiran
</button>


</div>



</div>





<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbzrdmWWyFdavRs5ZZa83gPWTSH0TXYu5wN98dLXIamohtfwceAmrUj69XDQGpz-Ta9t/exec";



let dataJamaah=[];



function loadData(){


fetch(API_URL+"?action=jamaah")

.then(r=>r.json())

.then(res=>{


dataJamaah=res.data;


document.getElementById(
"jumlahJamaah"
).innerHTML=dataJamaah.length;



let html="";


dataJamaah.forEach((j,i)=>{


html+=`

<div class="jamaah-card">

<div class="no">
No. ${i+1}
</div>


<div class="nama">
${j.nama}
</div>


<div>
${j.alamat || "-"}
</div>


</div>

`;


});


document.getElementById(
"daftarJamaah"
).innerHTML=html;


});


}





function simpanJamaah(){


let data={

action:"simpanJamaah",

nama:
nama.value,

alamat:
alamat.value

};



fetch(API_URL,{

method:"POST",

body:JSON.stringify(data)

})


.then(r=>r.json())

.then(res=>{


alert(
res.pesan || "Berhasil"
);


nama.value="";

alamat.value="";


loadData();


});


}






function bukaAbsensi(){


halamanAbsensi.style.display="block";


buatAbsensi();


}





function buatAbsensi(){


let html="";


dataJamaah.forEach(j=>{


html+=`

<div class="jamaah-card">


<div class="nama">
${j.nama}
</div>


<input type="checkbox"
id="hadir_${j.id}">

 Hadir


</div>


`;


});


daftarAbsensi.innerHTML=html;


}






function simpanAbsensi(){


let tanggal=
tanggalAbsensi.value;



if(!tanggal){

alert("Pilih tanggal dulu");

return;

}



let daftar=[];



dataJamaah.forEach(j=>{


let cek=
document.getElementById(
"hadir_"+j.id
);



daftar.push({

idJamaah:j.id,

nama:j.nama,

status:
cek.checked
?"Hadir"
:""


});


});




let data={


action:"saveAttendance",

tanggal:tanggal,

data:daftar


};




fetch(API_URL,{

method:"POST",

body:JSON.stringify(data)

})


.then(r=>r.json())

.then(res=>{


alert(
res.pesan ||
res.message ||
"Absensi tersimpan"
);


});


}





loadData();


</script>


</body>

</html>
