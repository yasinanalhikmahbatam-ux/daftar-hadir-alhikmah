<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daftar Hadir Jamaah AL-HIKMAH</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f5f9;
}

.header{
background:#087f5b;
color:white;
padding:20px;
text-align:center;
}

.container{
padding:15px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.menu{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 3px 8px #ddd;
cursor:pointer;
}

.angka{
font-size:35px;
font-weight:bold;
color:#087f5b;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-top:15px;
box-shadow:0 3px 8px #ddd;
}

input,textarea,select{

width:100%;
padding:12px;
box-sizing:border-box;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;

}


button{

width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#087f5b;
color:white;
font-size:16px;

}


.jamaah-card{

background:#fff;
padding:15px;
border-radius:12px;
margin-bottom:10px;
box-shadow:0 2px 5px #ddd;

}


.nama{

font-size:18px;
font-weight:bold;
color:#087f5b;

}


.alamat{

color:#555;
margin-top:5px;

}


.status-box{

margin-top:10px;

}


.hidden{

display:none;

}


</style>

</head>


<body>


<div class="header">

<h2>
DAFTAR HADIR JAMAAH<br>
PENGAJIAN AL-HIKMAH
</h2>

</div>



<div class="container">


<div class="grid">


<div class="menu">

<div class="angka" id="jumlahJamaah">
0
</div>

👥 Jamaah

</div>


<div class="menu" onclick="bukaAbsensi()">

<div class="angka" id="jumlahHadir">
0
</div>

✅ Absensi

</div>


</div>




<div class="card">

<h3>
Tambah Jamaah
</h3>


<input id="nama" placeholder="Nama Jamaah">


<textarea id="alamat" placeholder="Alamat"></textarea>


<button onclick="simpanJamaah()">
Simpan Jamaah
</button>


</div>





<div class="card">

<h3>
Daftar Jamaah
</h3>


<div id="daftarJamaah">
Memuat data...
</div>


</div>






<div class="card hidden" id="halamanAbsensi">


<h3>
Absensi Mingguan
</h3>


<input type="date" id="tanggal">


<div id="daftarAbsensi">

</div>


<br>


<button onclick="simpanAbsensi()">

Simpan Kehadiran

</button>


</div>



</div>





<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbzrdmWWyFdavRs5ZZa83gPWTSH0TXYu5wN98dLXIamohtfwceAmrUj69XDQGpz-Ta9t/exec";



let dataJamaah=[];



// LOAD JAMAAH

function loadData(){


fetch(API_URL+"?action=jamaah")

.then(r=>r.json())

.then(res=>{


dataJamaah=res.data || [];


document.getElementById(
"jumlahJamaah"
).innerHTML=dataJamaah.length;



let html="";


dataJamaah.forEach(function(j,i){


html+=`

<div class="jamaah-card">

<div>
No. ${i+1}
</div>


<div class="nama">
${j.nama}
</div>


<div class="alamat">
${j.alamat || "-"}
</div>


</div>

`;


});



document.getElementById(
"daftarJamaah"
).innerHTML =
html || "Belum ada jamaah";



});


}


loadData();





// SIMPAN JAMAAH


function simpanJamaah(){


let nama =
document.getElementById("nama").value;


let alamat =
document.getElementById("alamat").value;



if(!nama){

alert("Nama wajib diisi");

return;

}



let kirim={

action:"simpanJamaah",

nama:nama,

alamat:alamat

};



fetch(API_URL,{

method:"POST",

body:JSON.stringify(kirim)

})

.then(r=>r.json())

.then(res=>{


alert(
res.pesan || "Data tersimpan"
);



document.getElementById("nama").value="";

document.getElementById("alamat").value="";


loadData();


});


}







// ABSENSI


function bukaAbsensi(){


document.getElementById(
"halamanAbsensi"
).classList.remove("hidden");


buatAbsensi();


}





function buatAbsensi(){


let html="";


dataJamaah.forEach(function(j){


html+=`

<div class="jamaah-card">


<div class="nama">
${j.nama}
</div>


<select id="status_${j.id}">


<option value="Hadir">
Hadir
</option>


<option value="Izin">
Izin
</option>


<option value="Sakit">
Sakit
</option>


<option value="Alfa">
Alfa
</option>


</select>


</div>


`;


});



document.getElementById(
"daftarAbsensi"
).innerHTML=html;



}







function simpanAbsensi(){


let tanggal =
document.getElementById("tanggal").value;



if(!tanggal){

alert("Pilih tanggal dulu");

return;

}



let daftar=[];


dataJamaah.forEach(function(j){


daftar.push({

idJamaah:j.id,

nama:j.nama,

status:
document.getElementById(
"status_"+j.id
).value

});


});



let kirim={

action:"saveAttendance",

tanggal:tanggal,

data:daftar

};



fetch(API_URL,{

method:"POST",

body:JSON.stringify(kirim)

})


.then(r=>r.json())

.then(res=>{


alert(
res.message || 
"Kehadiran tersimpan"
);


});


}



</script>


</body>
</html>
